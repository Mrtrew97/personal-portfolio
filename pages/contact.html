<section class="bp-section">
  <div class="container">
    <div class="bp-section-header">
      <h2 class="bp-section-title" data-i18n="contact.title"></h2>
      <p class="bp-section-subtitle" data-i18n="contact.subtitle"></p>
    </div>
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="bp-card p-4 p-md-5">
          <form id="bp-contact-form" action="https://formspree.io/f/xpqvevja" method="POST">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="bp-contact-name" class="bp-form-label" data-i18n="contact.form.name_label"></label>
                <input type="text" id="bp-contact-name" name="name" class="form-control bp-form-control" data-i18n-attr="placeholder:contact.form.name_placeholder" required>
              </div>
              <div class="col-md-6 mb-3">
                <label for="bp-contact-email" class="bp-form-label" data-i18n="contact.form.email_label"></label>
                <input type="email" id="bp-contact-email" name="email" class="form-control bp-form-control" data-i18n-attr="placeholder:contact.form.email_placeholder" required>
              </div>
            </div>
            <div class="mb-3">
              <label for="bp-contact-subject" class="bp-form-label" data-i18n="contact.form.subject_label"></label>
              <input type="text" id="bp-contact-subject" name="subject" class="form-control bp-form-control" data-i18n-attr="placeholder:contact.form.subject_placeholder" required>
            </div>
            <div class="mb-4">
              <label for="bp-contact-message" class="bp-form-label" data-i18n="contact.form.message_label"></label>
              <textarea id="bp-contact-message" name="message" rows="5" class="form-control bp-form-control" data-i18n-attr="placeholder:contact.form.message_placeholder" required></textarea>
            </div>
            <button type="submit" class="bp-btn-primary w-100 py-3" data-i18n="contact.form.submit_btn"></button>
          </form>
          <div id="bp-form-status" class="mt-3"></div>
        </div>
      </div>
    </div>
  </div>
</section>
